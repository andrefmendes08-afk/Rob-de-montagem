
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Robô de Montagem: crie montagens com suas imagens.">
  <title>Meu Robô de Montagem</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    main {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px #0001;
    }
    h1 { color: #2563eb; text-align: center; }
    p { line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      height: auto;
      margin-top: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>🤖 Meu Robô de Montagem</h1>
    <p>Escolha duas imagens para criar sua montagem.</p>

    <label for="foto1">Primeira imagem</label>
    <input id="foto1" type="file" accept="image/*">

    <label for="foto2">Segunda imagem</label>
    <input id="foto2" type="file" accept="image/*">

    <button id="montar">Criar montagem</button>
    <button id="baixar">Baixar montagem</button>

    <p id="status">Escolha suas imagens para começar.</p>
    <canvas id="resultado" width="600" height="400"></canvas>
  </main>

  <script>
    const foto1 = document.getElementById('foto1');
    const foto2 = document.getElementById('foto2');
    const canvas = document.getElementById('resultado');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    function carregarImagem(arquivo) {
      return new Promise((resolve, reject) => {
        if (!arquivo) {
          reject(new Error('Escolha as duas imagens primeiro.'));
          return;
        }
        const imagem = new Image();
        const url = URL.createObjectURL(arquivo);
        imagem.onload = () => {
          URL.revokeObjectURL(url);
          resolve(imagem);
        };
        imagem.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Não foi possível abrir uma das imagens.'));
        };
        imagem.src = url;
      });
    }

    document.getElementById('montar').addEventListener('click', async () => {
      try {
        status.textContent = 'Criando sua montagem...';
        const [img1, img2] = await Promise.all([
          carregarImagem(foto1.files[0]),
          carregarImagem(foto2.files[0])
        ]);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img1, 0, 0, 300, 400);
        ctx.drawImage(img2, 300, 0, 300, 400);
        status.textContent = 'Montagem criada! Você já pode baixar.';
      } catch (erro) {
        status.textContent = erro.message;
      }
    });

    document.getElementById('baixar').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'minha-montagem.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
