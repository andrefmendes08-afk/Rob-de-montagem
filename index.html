
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c3ce9">
  <meta name="description" content="Robô de Montagens: crie montagens de fotos e imagens.">
  <link rel="manifest" href="./manifest.json">
  <title>Robô de Montagens</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6c3ce9, #e83e8c);
      color: #222;
      min-height: 100vh;
    }

    main {
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px #0002;
    }

    h1 {
      color: #6c3ce9;
    }

    p {
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #6c3ce9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 400px;
      margin-top: 20px;
      border-radius: 12px;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>🤖 Robô de Montagens</h1>
    <p>Escolha uma foto para começar sua montagem!</p>

    <input type="file" id="foto" accept="image/*">

    <img id="preview" alt="Prévia da imagem escolhida">

    <button id="baixar" hidden>
      Baixar imagem
    </button>

    <p id="status">Seu robô está pronto para começar!</p>
  </main>

  <script>
    const foto = document.getElementById("foto");
    const preview = document.getElementById("preview");
    const baixar = document.getElementById("baixar");
    const status = document.getElementById("status");

    let imagemAtual = "";

    foto.addEventListener("change", function () {
      const arquivo = foto.files[0];

      if (!arquivo) return;

      if (imagemAtual) {
        URL.revokeObjectURL(imagemAtual);
      }

      imagemAtual = URL.createObjectURL(arquivo);
      preview.src = imagemAtual;
      preview.style.display = "block";
      baixar.hidden = false;
      status.textContent = "Foto carregada! Você já pode baixá-la.";
    });

    baixar.addEventListener("click", function () {
      if (!imagemAtual) return;

      const link = document.createElement("a");
      link.href = imagemAtual;
      link.download = "minha-montagem.png";
      link.click();
    });

    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("./sw.js")
        .catch(function () {});
    }
  </script>
</body>
 </html>
